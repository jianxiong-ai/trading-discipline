<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/styles.css?v={{ asset_version }}">
    <link rel="stylesheet" href="/static/workspace.css?v={{ asset_version }}">
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ workspace_base }}"><i></i><span>持仓纪律</span></a>
        <nav>
          <a class="{{ 'active' if request.url.path == workspace_base else '' }}" href="{{ workspace_base }}">看板</a>
          <a class="{{ 'active' if request.url.path == workspace_base ~ '/positions' else '' }}" href="{{ workspace_base }}/positions">持仓</a>
          <a class="{{ 'active' if request.url.path == workspace_base ~ '/watchlist' else '' }}" href="{{ workspace_base }}/watchlist">股票池</a>
          <a class="{{ 'active' if request.url.path == workspace_base ~ '/notifications' else '' }}" href="{{ workspace_base }}/notifications">消息配置</a>
          {% if can_create_workspace %}<form method="post" action="/workspaces" class="workspace-create"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit">新建工作区</button></form>{% endif %}
        </nav>
      </div>
    </header>
    <main class="page">
      {% if notice %}<div class="flash success">{{ notice }}</div>{% endif %}
      {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
      {% block content %}{% endblock %}
    </main>
    <footer>只做研究与纪律提醒，不连接券商，不自动下单。</footer>
  </body>
</html>
