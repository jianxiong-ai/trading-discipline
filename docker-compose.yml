services:
  monitor:
    build: .
    restart: unless-stopped
    environment:
      ASTOCK_CONFIG: /app/config.yaml
      FEISHU_WEBHOOK: ${FEISHU_WEBHOOK:-}
      FEISHU_SECRET: ${FEISHU_SECRET:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-m", "astock_bot.main", "health"]
      interval: 30s
      timeout: 5s
      retries: 3

